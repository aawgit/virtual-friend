<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FBX Multi-Mesh Blendshape Controller</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; color: white; font-family: sans-serif; }
    canvas { display: block; }
    #sliderContainer {
      position: fixed; top: 10px; right: 10px;
      max-height: 90vh; overflow-y: auto;
      background: #222; padding: 10px; border-radius: 8px;
      font-size: 13px;
    }
    .mesh-group { margin-bottom: 1em; }
    .mesh-group h3 { margin: 0 0 5px 0; font-size: 14px; color: #6cf; }
    .slider-group { margin: 4px 0; }
    .slider-group label { font-size: 12px; display: block; margin-bottom: 2px; }
  </style>
</head>
<body>
  <div id="sliderContainer"></div>
  <script type="module">
    import * as THREE from 'https://esm.sh/three@0.160.0';
    import { FBXLoader } from 'https://esm.sh/three@0.160.0/examples/jsm/loaders/FBXLoader.js';

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0.5, 3);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0x888888));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight.position.set(1, 2, 3);
    scene.add(dirLight);

    const loader = new FBXLoader();
    const morphMeshes = [];

    const sliderContainer = document.getElementById('sliderContainer');

    function createSlidersForMesh(mesh) {
      const groupDiv = document.createElement('div');
      groupDiv.className = 'mesh-group';

      const title = document.createElement('h3');
      title.innerText = mesh.name || 'Unnamed Mesh';
      groupDiv.appendChild(title);

      const dict = mesh.morphTargetDictionary;
      const influences = mesh.morphTargetInfluences;

      Object.entries(dict).forEach(([name, index]) => {
        const sliderGroup = document.createElement('div');
        sliderGroup.className = 'slider-group';

        const label = document.createElement('label');
        label.textContent = name;

        const slider = document.createElement('input');
        slider.type = 'range';
        slider.min = 0;
        slider.max = 1;
        slider.step = 0.01;
        slider.value = influences[index] || 0;

        slider.oninput = () => {
          influences[index] = parseFloat(slider.value);
        };

        sliderGroup.appendChild(label);
        sliderGroup.appendChild(slider);
        groupDiv.appendChild(sliderGroup);
      });

      sliderContainer.appendChild(groupDiv);
    }

    loader.load('./Ally Face Head Model with hair.fbx', (fbx) => {
      fbx.scale.set(4, 4, 4);
      scene.add(fbx);

      fbx.traverse((child) => {
        if (child.isMesh && child.morphTargetDictionary && child.morphTargetInfluences) {
          morphMeshes.push(child);
          createSlidersForMesh(child);
        }
      });

      if (morphMeshes.length === 0) {
        console.warn('No morph targets found in this model.');
      }
    }, undefined, (err) => {
      console.error('Error loading FBX:', err);
    });

    function applyBlendshapeFrame(frame) {
      morphMeshes.forEach(mesh => {
        const influences = mesh.morphTargetInfluences;
        const dict = mesh.morphTargetDictionary;
        Object.entries(dict).forEach(([name, index], i) => {
          if (i < frame.length) {
            influences[index] = frame[i];
          }
        });
      });
    }

    // Animation controls
    let animationData = [];
    let frameDelay = 100; // milliseconds (calculated)
    let totalDurationSec = 2; // default total animation duration
    let isPlaying = false;

    async function playAnimation() {
      if (!animationData.length || isPlaying) return;
      isPlaying = true;

      frameDelay = (totalDurationSec * 1000) / animationData.length;

      for (let i = 0; i < animationData.length; i++) {
        applyBlendshapeFrame(animationData[i]);
        await new Promise(resolve => setTimeout(resolve, frameDelay));
      }

      isPlaying = false;
    }

    // Animation UI
    const controlsDiv = document.createElement('div');
    controlsDiv.style.marginTop = '1em';

    const input = document.createElement('textarea');
    input.placeholder = 'Paste JSON blendshape sequence here';
    input.rows = 6;
    input.cols = 40;
    input.style.width = '100%';
    controlsDiv.appendChild(input);

    // Total Duration input
    const durationLabel = document.createElement('label');
    durationLabel.textContent = 'Total Duration (seconds): ';
    durationLabel.style.display = 'block';
    durationLabel.style.marginTop = '0.5em';

    const durationInput = document.createElement('input');
    durationInput.type = 'number';
    durationInput.value = totalDurationSec;
    durationInput.min = 0.1;
    durationInput.step = 0.1;
    durationInput.style.width = '60px';
    durationInput.oninput = () => {
      totalDurationSec = parseFloat(durationInput.value);
    };
    durationLabel.appendChild(durationInput);
    controlsDiv.appendChild(durationLabel);

    const playBtn = document.createElement('button');
    playBtn.textContent = 'Play Animation';
    playBtn.style.marginTop = '0.5em';
    playBtn.onclick = () => {
      try {
        animationData = JSON.parse(input.value);
        if (!Array.isArray(animationData) || animationData.length === 0) throw new Error();
        playAnimation();
      } catch (e) {
        alert('Invalid JSON format!');
        console.error(e);
      }
    };
    controlsDiv.appendChild(playBtn);

    sliderContainer.appendChild(controlsDiv);

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }

    animate();
  </script>

</body>
</html>
