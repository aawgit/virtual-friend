<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARKit BlendShape Viewer (Fox Demo)</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #1e1e1e;
    }

    canvas {
      display: block;
    }
  </style>
</head>

<body>
  <input type="file" id="fileInput" accept=".glb" />
  <script type="module">
    import * as THREE from "https://esm.sh/three@0.160.0";
    import { GLTFLoader } from "https://esm.sh/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";
    // import { GLTFLoader } from 'https://unpkg.com/three/examples/jsm/loaders/GLTFLoader.js';

    const fileInput = document.getElementById('fileInput');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1e1e1e);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0.5, 3.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(1, 2, 3);
    scene.add(light);


    scene.add(new THREE.AmbientLight(0xffffff, 0.5));

    const blendshapeCoefficients = new Array(52).fill(0);
    blendshapeCoefficients[0] = 0.8;
    blendshapeCoefficients[1] = 0.3;
    blendshapeCoefficients[2] = 0.5;

    const loader = new GLTFLoader();

    let targetMesh = null;

    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (e) {
        const arrayBuffer = e.target.result;

        loader.parse(arrayBuffer, '', (gltf) => {
          const model = gltf.scene;
          model.scale.set(1, 1, 1);
          model.position.set(0, -0.5, 0);
          scene.add(model);

          model.traverse((child) => {
            if (child.isMesh && child.morphTargetInfluences) {
              targetMesh = child;
              console.log("✅ Found morph targets on:", child.name);
              console.log("Morph Target Names:", child.morphTargetDictionary);
            }
          });
        });
      };
      reader.readAsArrayBuffer(file);
    });

    // const loader = new GLTFLoader();
    // loader.load("https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Fox/glTF/Fox.gltf", (gltf) => {
    //   const model = gltf.scene;
    //   model.scale.set(0.02, 0.02, 0.02);  // 🔽 Scale down
    //   model.position.set(0, -0.5, 0);     // ⬇ Recenter vertically if needed
    //   scene.add(model);

    //   model.traverse((child) => {
    //     if (child.isMesh && child.morphTargetInfluences) {
    //       console.log("Mesh with morphs:", child.name);
    //       console.log("Available morph targets:", child.morphTargetDictionary);
    //       for (let i = 0; i < Math.min(child.morphTargetInfluences.length, blendshapeCoefficients.length); i++) {
    //         child.morphTargetInfluences[i] = blendshapeCoefficients[i];
    //       }
    //     }
    //   });
    // });

    function animate() {
      requestAnimationFrame(animate);
      // scene.rotation.y += 0.005;
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>

</html>
