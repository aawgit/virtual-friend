<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARKit Blendshape Viewer</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #111;
            color: white;
            font-family: sans-serif;
        }

        canvas {
            display: block;
        }

        #sliderContainer {
            position: fixed;
            top: 10px;
            right: 10px;
            max-height: 90vh;
            overflow-y: auto;
            background: #222;
            padding: 10px;
            border-radius: 8px;
        }

        .slider-group {
            margin: 5px 0;
        }

        .slider-group label {
            font-size: 12px;
            display: block;
            margin-bottom: 2px;
        }
    </style>
</head>

<body>
    <div id="sliderContainer"></div>
    <script type="module">
        import * as THREE from "https://esm.sh/three@0.160.0";
        import { GLTFLoader } from "https://esm.sh/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(1, 1, 1);
        scene.add(light);

        const ambientLight = new THREE.AmbientLight(0x888888);
        scene.add(ambientLight);

        camera.position.set(0, 1.5, 2.5);


        let meshWithMorphs = null;
        const sliders = {};

        function applyBlendshapeCoefficients(coefs) {
            console.log(`Trying to apply the coefs ${coefs}..`)
            if (!meshWithMorphs || !meshWithMorphs.morphTargetDictionary) {
                console.log(`Not applying the coefs..`)
                return;
            }
            const dict = meshWithMorphs.morphTargetDictionary;
            const influences = meshWithMorphs.morphTargetInfluences;
            console.log(`influences len ${influences.length}`)
            Object.entries(dict).forEach(([name, index], i) => {
                if (i < 124 && index < influences.length) {
                    console.log(`applying coef ${coefs[i]}`)
                    const val = coefs[i] || 0;
                    if(val>0) console.log(`applying non zero coef ${i} ${coefs[i]}`)
                    influences[index] = val;
                    if (sliders[name]) sliders[name].value = val;
                }
            });
        }


        function createSliders(dict) {
            const container = document.getElementById('sliderContainer');
            Object.entries(dict).forEach(([name, index], i) => {
                // if (i >= 52) return;
                const group = document.createElement('div');
                group.className = 'slider-group';

                const label = document.createElement('label');
                label.innerText = name;

                const slider = document.createElement('input');
                slider.type = 'range';
                slider.min = 0;
                slider.max = 1;
                slider.step = 0.01;
                slider.value = 0;
                slider.oninput = () => {
                    meshWithMorphs.morphTargetInfluences[index] = parseFloat(slider.value);
                };

                sliders[name] = slider;
                group.appendChild(label);
                group.appendChild(slider);
                container.appendChild(group);
            });
        }

        const loader = new GLTFLoader();
        loader.load('./kelly_-_woman_head_with_blendshapes.glb', (gltf) => {
            const model = gltf.scene;
            scene.add(model);
            // model.rotation.y = Math.PI;

            model.traverse((child) => {
                if (child.isMesh && child.morphTargetInfluences) {
                    console.log("Found mesh with morph targets:", child.name);
                    // You can log to inspect and optionally choose by name
                    if (!meshWithMorphs && child.morphTargetInfluences ) {
                        meshWithMorphs = child;
                        createSliders(meshWithMorphs.morphTargetDictionary);
                    }
                }
            });


            if (meshWithMorphs) {
                // createSliders(meshWithMorphs.morphTargetDictionary);

                // Example: apply sample input blendshape coefficients
                const testInput = new Array(100).fill(0);
                testInput[67] = 1; 
                // testInput[69 - 17] = 1; // Example: eyeBlinkLeft
                applyBlendshapeCoefficients(testInput);
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        animate();
        // eyes Facebaked_custom_1
        // mouth Facebaked_custom_3
    </script>
</body>
</html>
